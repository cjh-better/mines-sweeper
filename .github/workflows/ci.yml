name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.20'

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev libasound2-dev

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: |
        ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v3
      with:
        name: bitsweeper-windows-release
        path: |
          build/ui/bitsweeper-game.exe
          build/ui/*.dll

    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v3
      with:
        name: bitsweeper-linux-release
        path: build/ui/bitsweeper-game

    - name: Upload artifacts (macOS)
      if: runner.os == 'macOS' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v3
      with:
        name: bitsweeper-macos-release
        path: build/ui/bitsweeper-game
