name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Fast feedback: build + test (Debug, Linux only) ───────────────
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache submodules
      uses: actions/cache@v4
      with:
        path: |
          ui/lib/raylib
          core/test/lib/unity
        key: submodules-${{ hashFiles('.gitmodules') }}

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev

    - name: Cache CMake build (Debug)
      uses: actions/cache@v4
      with:
        path: build
        key: cmake-debug-ubuntu-${{ hashFiles('CMakeLists.txt', 'core/CMakeLists.txt', 'ui/CMakeLists.txt', 'core/src/**', 'ui/src/**') }}
        restore-keys: |
          cmake-debug-ubuntu-

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Test
      working-directory: build
      run: ctest --build-config Debug --output-on-failure --parallel $(nproc)

  # ─── Release builds + artifacts (all platforms, only after tests pass) ─
  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bitsweeper-linux-release
            artifact_path: build/ui/bitsweeper-game
          - os: windows-latest
            artifact_name: bitsweeper-windows-release
            artifact_path: |
              build/ui/Release/bitsweeper-game.exe
              build/ui/Release/*.dll
          - os: macos-latest
            artifact_name: bitsweeper-macos-release
            artifact_path: build/ui/bitsweeper-game

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache submodules
      uses: actions/cache@v4
      with:
        path: |
          ui/lib/raylib
          core/test/lib/unity
        key: submodules-${{ hashFiles('.gitmodules') }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev

    - name: Cache CMake build (Release)
      uses: actions/cache@v4
      with:
        path: build
        key: cmake-release-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'core/CMakeLists.txt', 'ui/CMakeLists.txt', 'core/src/**', 'ui/src/**') }}
        restore-keys: |
          cmake-release-${{ matrix.os }}-

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
